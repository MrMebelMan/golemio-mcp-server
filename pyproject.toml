[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "golemio-mcp"
version = "1.0.0"
description = "MCP server exposing Prague's Golemio API for AI assistants"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Vladyslav Burzakovskyy" }]
keywords = ["mcp", "golemio", "prague", "api", "public-transit", "transport"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
]

[project.scripts]
golemio-mcp = "golemio_mcp:main"

[project.urls]
Homepage = "https://github.com/MrMebelMan/golemio-mcp-server"
Repository = "https://github.com/MrMebelMan/golemio-mcp-server"
Issues = "https://github.com/MrMebelMan/golemio-mcp-server/issues"
Changelog = "https://github.com/MrMebelMan/golemio-mcp-server/releases"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]
