[project]
name = "golemio-mcp"
version = "0.1.0"
description = "MCP server exposing Prague's Golemio API for AI assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
]

[project.scripts]
golemio-mcp = "golemio_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]
